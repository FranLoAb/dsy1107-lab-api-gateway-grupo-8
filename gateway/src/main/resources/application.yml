server:
  port: 8080

spring:
  application:
    name: dsy1107-api-gateway-lab
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Gateway-Lab, DSY1107
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "http://localhost:5500"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
        webmvc:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "http://localhost:5500"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: posts-v1
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - RewritePath=/api/v1/(?<segment>.*), /$\{segment}
                - AddResponseHeader=X-API-Version, v1
                - AddResponseHeader=X-Gateway-Lab, DSY1107
            - id: posts-v2
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v2/posts/**
              filters:
                - RewritePath=/api/v2/(?<segment>.*), /$\{segment}
                - AddResponseHeader=X-API-Version, v2
                - AddResponseHeader=X-Gateway-Lab, DSY1107

lab:
  cors:
    enabled: true
    allowed-origin: http://localhost:5500