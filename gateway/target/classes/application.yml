server:
  port: 8080

spring:
  application:
    name: dsy1107-api-gateway-lab
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "http://localhost:5500"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: posts-v1
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - RewritePath=/api/v1/(?<segment>.*), /$\{segment}

lab:
  cors:
    enabled: true
    allowed-origin: http://localhost:5500